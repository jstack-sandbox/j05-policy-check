name: no-mistakes
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    steps:
      - name: wait until the step releases this commit's CI
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: https://api.github.com/repos/${{ github.repository }}/contents/${{ github.event.pull_request.head.sha || github.sha }}/ci-release?ref=jstack-fixtures
        run: |
          until curl -fsS -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$RELEASE"; do sleep 5; done
      - name: take as long as this commit's fixtures say
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          wait=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/jstack-fixtures/$SHA/no-mistakes-wait" || echo 0)
          sleep "$wait"
